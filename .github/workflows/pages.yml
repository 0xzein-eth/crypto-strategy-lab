name: Validate dashboard
on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'data/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check static dashboard and JSON
        run: |
          test -s dashboard/index.html
          python -m json.tool data/ledger.json >/dev/null
          python -m json.tool data/report.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: paper-research-dashboard
          path: dashboard/
          retention-days: 7
