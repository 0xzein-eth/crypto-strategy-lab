name: Matched controls research
on:
  push:
    paths:
      - 'matched_controls.py'
      - 'tests/test_matched_controls.py'
      - '.github/workflows/matched-controls.yml'
  pull_request:
  workflow_dispatch:
  # Keep downloadable rankings reasonably fresh without writing to ledger.
  schedule:
    - cron: '27 0,6,12,18 * * *'
permissions:
  contents: read
jobs:
  audit-and-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test matching logic
        run: python -m unittest discover -s tests -p 'test_matched_controls.py' -v
      - name: Validate immutable ledger
        run: python audit.py
      - name: Compare eligible paper closes with matched controls
        run: python matched_controls.py --output matched-controls-report.json --leaderboard strategy-leaderboard.json
      - name: Upload read-only research report
        uses: actions/upload-artifact@v4
        with:
          name: matched-controls-paper-report
          path: |
            matched-controls-report.json
            strategy-leaderboard.json
          retention-days: 30
