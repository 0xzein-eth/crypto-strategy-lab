name: Crypto Lab v2 independent hypothesis readiness
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify original event-chain integrity
        run: python engine.py --verify-only
      - name: Run no-peeking feasibility and strategy triage tests
        run: python -m unittest discover -s tests -p 'test_v2_cost_and_review.py' -v
      - name: Publish research-only per-arm readiness scorecard
        run: python -m v2.research_review --output /tmp/v2-readonly-hypothesis-review.json
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-lab-v2-readonly-hypothesis-readiness
          path: /tmp/v2-readonly-hypothesis-review.json
          retention-days: 30
