name: Ledger integrity and schedule watchdog
on:
  workflow_dispatch:
  schedule:
    - cron: '09,39 * * * *'
permissions:
  contents: read
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify ledger and detect missed scheduled observations
        run: |
          set -euo pipefail
          python health.py --max-hours 1.25 | tee /tmp/lab-health.json
          echo '### Paper lab health' >> "$GITHUB_STEP_SUMMARY"
          echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/lab-health.json >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
