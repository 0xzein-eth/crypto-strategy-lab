name: Research quality gates
on:
  push:
    paths:
      - 'research_quality.py'
      - 'research_quality/**'
      - 'temporal_evidence.py'
      - 'tests/test_temporal_evidence.py'
      - 'tests/test_research_quality.py'
      - '.github/workflows/research-quality.yml'
  pull_request:
  workflow_dispatch:
  # Reassess research quality automatically even when no policy/code changed.
  # GitHub cron delivery remains best-effort.
  schedule:
    - cron: '13 05,17 * * *'
  # Also refresh read-only checks when historical research finishes.
  workflow_run:
    workflows: ['Historical Research Factory v9']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: research-quality-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run all unit tests
        run: python -m unittest discover -s tests -v
      - name: Audit canonical ledger
        run: python audit.py
      - name: Produce quality gate artifact without modifying history
        run: |
          python - <<'PY'
          import json
          import engine
          import matched_controls
          import research_quality
          import temporal_evidence
          import datetime as dt
          records, _, _, _ = engine.replay()
          report = json.loads(engine.REPORT.read_text(encoding="utf-8"))
          coverage = report.get("scheduling_diagnostics", {}).get("estimated_10m_slot_coverage")
          matched = matched_controls.compare(records)
          result = research_quality.evaluate(records, matched, coverage)
          observed_at = dt.datetime.fromisoformat(report["timestamp"].replace("Z","+00:00"))
          # Diagnostic uses only ledger-verified observed eligible CLOSED paper
          # trades; no retrospective backfill, strategy promotion, or fake days.
          result["prospective_temporal_evidence"] = temporal_evidence.summarize(
              records, observed_at)
          assert result["prospective_temporal_evidence"]["edge_proven"] is False
          # Genuine completed UTC days and entry-time regime breadth; neither
          # changes trade allocation, backfills data nor promotes a strategy.
          overall = result["prospective_temporal_evidence"]["overall"]
          assert len(overall["missing_eligible_entry_days_last_7_completed_utc_days"]) <= 7
          assert overall["additional_distinct_days_needed"] >= 0
          if not overall["completed_utc_day_yesterday_has_eligible_close"]:
              print("::warning::DATA_COVERAGE_GAP: yesterday UTC has no eligible "
                    "closed perpetual entries as of this ledger snapshot; "
                    "may still be pending at fixed horizon")
          if not overall["four_daypart_breadth_ready"]:
              print("::notice::RESEARCH_TIME_BREADTH: need more real UTC days "
                    "covering every six-hour time bin")
          assert not any(x["edge_proven"] for x in result["arms"].values())
          result["source_report_timestamp_utc"] = report["timestamp"]
          result["source_ledger_tip_sha256"] = report["ledger_tip_sha256"]
          with open("research-quality-report.json", "w", encoding="utf-8") as f:
              json.dump(result, f, indent=2, sort_keys=True, allow_nan=False)
          print("Quality report generated for", len(result["arms"]), "strategy arms")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-quality-report
          path: research-quality-report.json
          retention-days: 30
