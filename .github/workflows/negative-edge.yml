name: Negative expectancy diagnostic
on:
  push:
    paths:
      - 'negative_edge_diagnostic.py'
      - 'negative_edge_attribution.py'
      - 'tests/test_negative_edge_attribution.py'
      - 'matched_controls.py'
      - 'tests/test_negative_edge_diagnostic.py'
      - '.github/workflows/negative-edge.yml'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '31 06 * * *'
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Ledger integrity
        run: python audit.py
      - name: Compute training-only loss warnings
        run: |
          python - <<'PY'
          import json
          import engine
          import negative_edge_diagnostic
          import matched_controls
          records, seq, tip, _ = engine.replay()
          report = json.loads(engine.REPORT.read_text(encoding="utf-8"))
          matched = matched_controls.compare(records)
          result = negative_edge_diagnostic.evaluate(records, matched_comparison=matched)
          result["source_ledger_tip_sha256"] = tip
          result["source_verified_events"] = seq
          result["source_report_timestamp_utc"] = report["timestamp"]
          with open("negative-edge-report.json", "w", encoding="utf-8") as file:
              json.dump(result, file, indent=2, sort_keys=True, allow_nan=False)
          print("Negative absolute:", [k for k,v in result["arms"].items() if v["negative_expectancy_warning"]])
          print("Worse than matched TRAIN controls:", [k for k,v in result["arms"].items() if v["worse_than_matched_control_training_warning"]])
          import negative_edge_attribution
          attribution = negative_edge_attribution.evaluate(records)
          attribution["source_ledger_tip_sha256"] = tip
          attribution["source_verified_events"] = seq
          with open("negative-edge-attribution.json", "w", encoding="utf-8") as file:
              json.dump(attribution, file, indent=2, sort_keys=True, allow_nan=False)
          print("Descriptive regime/horizon loss cohorts:", {
              d: [name for name,v in cell.items() if v["descriptive_negative_warning"]]
              for d,cell in attribution["dimensions"].items()})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: negative-edge-research-report
          path: |
            negative-edge-report.json
            negative-edge-attribution.json
          retention-days: 30
