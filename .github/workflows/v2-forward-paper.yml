name: Crypto Lab v2 durable public-market PAPER wallet
on:
  # Kick the first REAL data run immediately after code is merged, instead
  # of waiting for GitHub's best-effort schedule. Excludes v2_state and v8
  # ledger commits, so an observation push never triggers itself recursively.
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - 'tests/test_v2_*.py'
      - '.github/workflows/v2-forward-paper.yml'
  workflow_dispatch:
  # Additional REAL clock from the already active canonical v8 observer.
  # Bounded once per successfully completed main lab workflow, serialized
  # with normal v2 schedule; no fabricated missed 30m observations.
  workflow_run:
    workflows: ["Continuous paper strategy lab"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
# Do NOT share v8 canonical ledger writer lock; state paths are disjoint.
# All v2 writes MUST use this single group to prevent ledger forks.
concurrency:
  group: v2-public-paper-wallet-one-writer
  cancel-in-progress: false
jobs:
  observe-and-persist:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Audit canonical v8 ledger but NEVER write v8 data
        run: python engine.py --verify-only
      - name: Run deterministic v2 replay and public-market contract tests
        run: |
          python -m unittest discover -s tests -p 'test_v2_forward_paper.py' -v
          python -m unittest discover -s tests -p 'test_v2_source_end_to_end.py' -v
          python -m unittest discover -s tests -p 'test_v2_paper_portfolio.py' -v
          python -m v2.forward_paper --verify-only
      - name: Observe verified exchange books and confirmed signal rules
        id: observe
        run: python -m v2.forward_paper --observe
      - name: Verify persisted observation hashes, cash and equity curve
        run: |
          python -m v2.forward_paper --verify-only
          git diff --check
          if git status --porcelain data/ | grep .; then
            echo "INTEGRITY_FAILURE: the v2 observer must never modify v8 data/"
            exit 1
          fi
      - name: Verify all-arms prospective shadow cohort regression
        run: |
          python -m unittest discover -s tests -p 'test_v2_shadow_research.py' -v
          python -m v2.forward_paper --verify-only
      - name: Commit ONLY isolated new v2 forward-paper observation history
        run: |
          if [[ ! -d v2_state ]]; then
            echo "SOURCE_UNAVAILABLE: no verified v2 observation created"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- v2_state/
          if git diff --cached --quiet; then
            echo "Same 30-minute market slot already recorded; no duplicate commit."
            exit 0
          fi
          git commit -m "paper(v2): genuine public-book observation and derived wallet equity [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Persisted one verified new v2 observation on main."
              exit 0
            fi
            echo "Non-fast-forward: attempt ${attempt}; safely replay git history."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "INTEGRITY_FAILURE: concurrent ledger conflict; no force push."
              git rebase --abort || true
              exit 1
            fi
          done
          echo "PERSISTENCE_FAILURE: unable to persist without force."
          exit 1

      - name: Record workflow health without inventing market observations
        if: always()
        env:
          OBSERVER_OUTCOME: ${{ steps.observe.outcome }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import datetime as dt, json, os, pathlib
          out={
              "schema":"v2-workflow-operational-health-v1",
              "workflow_trigger":os.environ["EVENT_NAME"],
              "observer_step_result":os.environ.get("OBSERVER_OUTCOME","not_started"),
              "actual_v2_observation_file_exists":pathlib.Path("v2_state/observations.jsonl").exists(),
              "actual_v2_equity_report_exists":pathlib.Path("v2_state/report.json").exists(),
              "actual_v2_shadow_report_exists":pathlib.Path("v2_state/shadow_report.json").exists(),
              "recorded_at_utc":dt.datetime.now(dt.timezone.utc).isoformat(),
              "health_is_not_a_market_snapshot":True,
              "real_orders_submitted":False,
          }
          pathlib.Path("/tmp/v2-observer-run-health.json").write_text(
              json.dumps(out,sort_keys=True,indent=2)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY
      - name: Upload operational proof even when public feed fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-observer-run-health
          path: /tmp/v2-observer-run-health.json
          retention-days: 14
