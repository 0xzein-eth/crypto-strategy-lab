name: Crypto Lab v2 durable public-market PAPER wallet
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
# Do NOT share v8 canonical ledger writer lock; state paths are disjoint.
# All v2 writes MUST use this single group to prevent ledger forks.
concurrency:
  group: v2-public-paper-wallet-one-writer
  cancel-in-progress: false
jobs:
  observe-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Audit canonical v8 ledger but NEVER write v8 data
        run: python engine.py --verify-only
      - name: Run deterministic v2 replay and public-market contract tests
        run: |
          python -m unittest discover -s tests -p 'test_v2_forward_paper.py' -v
          python -m unittest discover -s tests -p 'test_v2_paper_portfolio.py' -v
          python -m v2.forward_paper --verify-only
      - name: Observe verified exchange books and confirmed signal rules
        run: python -m v2.forward_paper --observe
      - name: Verify persisted observation hashes, cash and equity curve
        run: |
          python -m v2.forward_paper --verify-only
          git diff --check
          if git status --porcelain data/ | grep .; then
            echo "INTEGRITY_FAILURE: the v2 observer must never modify v8 data/"
            exit 1
          fi
      - name: Commit ONLY isolated new v2 forward-paper observation history
        run: |
          if [[ ! -d v2_state ]]; then
            echo "SOURCE_UNAVAILABLE: no verified v2 observation created"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- v2_state/
          if git diff --cached --quiet; then
            echo "Same 30-minute market slot already recorded; no duplicate commit."
            exit 0
          fi
          git commit -m "paper(v2): genuine public-book observation and derived wallet equity [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Persisted one verified new v2 observation on main."
              exit 0
            fi
            echo "Non-fast-forward: attempt ${attempt}; safely replay git history."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "INTEGRITY_FAILURE: concurrent ledger conflict; no force push."
              git rebase --abort || true
              exit 1
            fi
          done
          echo "PERSISTENCE_FAILURE: unable to persist without force."
          exit 1
