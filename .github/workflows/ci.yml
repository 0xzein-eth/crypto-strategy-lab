name: CI tests
on:
  push:
    paths:
      - 'lab.py'
      - 'engine.py'
      - 'signals.py'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile lab.py engine.py signals.py
      - run: python engine.py --verify-only
