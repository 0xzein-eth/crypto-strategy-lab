name: CI tests
on:
  push:
    paths:
      - 'lab.py'
      - 'engine.py'
      - 'signals.py'
      - 'regime_hypotheses.py'
      - 'diverse_confirmed.py'
      - 'band_hypotheses.py'
      - 'entry_sampling.py'
      - 'negative_edge_diagnostic.py'
      - 'dataset_health.py'
      - 'matched_controls.py'
      - 'learner.py'
      - 'universe.py'
      - 'friction.py'
      - 'outcome_stats.py'
      - 'temporal_evidence.py'
      - 'research_quality.py'
      - 'audit.py'
      - 'health.py'
      - 'scheduler_guard.py'
      - 'recovery_window.py'
      - 'tests/**'
      - 'v2/**'
      - 'stock_lab/**'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile lab.py engine.py signals.py regime_hypotheses.py diverse_confirmed.py band_hypotheses.py entry_sampling.py learner.py matched_controls.py negative_edge_diagnostic.py regime_evidence.py dataset_health.py universe.py friction.py outcome_stats.py temporal_evidence.py research_quality.py audit.py health.py scheduler_guard.py recovery_window.py
      - run: python -m py_compile v2/__init__.py v2/legacy_audit.py v2/data_contract.py v2/signal_parity.py v2/paper_portfolio.py v2/cost_gate.py v2/research_review.py v2/shadow_research.py v2/forward_paper.py v2/okx_observer_source.py
      - run: python -m py_compile stock_lab/__init__.py stock_lab/source.py stock_lab/strategies.py stock_lab/engine.py stock_lab/research.py
      - run: python -m v2.legacy_audit --verify-main > /tmp/v2-legacy-fee-and-exposure-audit.json
      - run: python audit.py
      - run: python engine.py --verify-only
