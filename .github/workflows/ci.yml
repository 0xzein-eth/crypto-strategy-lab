name: CI tests
on:
  push:
    paths:
      - 'lab.py'
      - 'engine.py'
      - 'signals.py'
      - 'learner.py'
      - 'universe.py'
      - 'friction.py'
      - 'outcome_stats.py'
      - 'audit.py'
      - 'health.py'
      - 'scheduler_guard.py'
      - 'recovery_window.py'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile lab.py engine.py signals.py learner.py universe.py friction.py outcome_stats.py audit.py health.py scheduler_guard.py recovery_window.py
      - run: python audit.py
      - run: python engine.py --verify-only
