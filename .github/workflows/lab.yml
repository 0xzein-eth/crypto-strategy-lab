name: Continuous paper strategy lab
on:
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'
permissions:
  contents: write
concurrency:
  group: continuous-canonical-paper-ledger
  cancel-in-progress: false
jobs:
  observe-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify historical event integrity
        run: python engine.py --verify-only
      - name: Run regression and lifecycle tests
        run: python -m unittest discover -s tests -v
      - name: Capture public market observations and run paper experiments
        run: python engine.py --count 6
      - name: Verify new event history and source files
        run: |
          python engine.py --verify-only
          python audit.py
          python -m json.tool data/report.json > /dev/null
          python -m json.tool data/state.json > /dev/null
          git diff --check
      - name: Commit paper ledger and report atomically to Git history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if ! git diff --cached --quiet; then
            git commit -m "paper(v8): observed prospective event ledger [skip ci]"
            # Ordinary code/documentation pushes may race with a running workflow.
            # Retry via fast-forward-compatible rebase; never force and never
            # silently resolve ledger conflicts.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Non-fast-forward (attempt ${attempt}); attempting safe rebase."
              git fetch origin main
              if ! git rebase origin/main; then
                echo "INTEGRITY_FAILURE: rebase conflict; refusing to overwrite canonical ledger."
                git rebase --abort || true
                exit 1
              fi
            done
            echo "PERSISTENCE_FAILURE: unable to push after three safe retries."
            exit 1
          fi
