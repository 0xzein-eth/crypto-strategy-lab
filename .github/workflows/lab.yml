name: Paper research lab
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: canonical-ledger
  cancel-in-progress: false
jobs:
  paper-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and execute paper research
        run: python lab.py
      - name: Commit immutable ledger records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ledger.json data/report.json
          if ! git diff --cached --quiet; then
            git commit -m "paper: scheduled prospective ledger update"
            git push
          fi
