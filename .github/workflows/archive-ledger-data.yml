name: Lossless immutable ledger archive migration
on:
  push:
    branches: [main]
    paths:
      - 'archive_event_data.py'
      - '.github/workflows/archive-ledger-data.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: continuous-canonical-paper-ledger
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify current immutable ledgers
        run: |
          python engine.py --verify-only
          python -m unittest discover -s tests -p 'test_opportunity_history.py' -v
          python -m unittest discover -s tests -p 'test_archive_event_data.py' -v
      - name: Losslessly gzip archive old JSONL segments
        run: python archive_event_data.py --keep-latest 1
      - name: Verify canonical records and hash chains after archive
        run: |
          python engine.py --verify-only
          python -m v2.legacy_audit --verify-main
      - name: Commit compressed representations without changing event rows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No archive migration changes."
            exit 0
          fi
          git commit -m "storage: losslessly gzip immutable paper history"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep 3
          done
          echo "Could not safely publish archive migration." >&2
          exit 1
