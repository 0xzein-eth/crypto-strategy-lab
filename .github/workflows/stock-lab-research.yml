name: Archive Audit - Former six-stock IDX historical research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archived-ledger-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read-only historical ledger verification - NO new IDX trade
        run: |
          python -m stock_lab.engine --verify-only
          python -m unittest discover -s tests -p 'test_stock_lab.py' -v
          echo "ARCHIVED: former six-stock/4-arm IDX workflow has no cron, push, or trading capture."
          echo "New Nasdaq/LQ45 wallets are managed ONLY in dual-equity-lab.yml."
